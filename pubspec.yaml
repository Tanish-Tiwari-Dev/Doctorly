name: doctorly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.3.0
  geolocator: ^13.0.4
  google_fonts: ^7.0.1
  supabase_flutter: ^2.5.0
  intl: ^0.20.0
  flutter_dotenv: ^5.2.1
  logging: ^1.3.0
  # cached_network_image is used for doctor avatar caching to reduce
  # repeated network requests and improve scroll performance.
  cached_network_image: ^3.4.1
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.2
  sentry_flutter: ^8.9.0
  shimmer: ^3.0.0
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
